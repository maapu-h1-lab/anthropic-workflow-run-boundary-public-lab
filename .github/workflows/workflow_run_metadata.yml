name: Workflow Run Metadata Check

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print safe event metadata
        run: |
          echo "actor=${{ github.actor }}"
          echo "event=${{ github.event_name }}"
          echo "workflow_run_event=${{ github.event.workflow_run.event }}"
          echo "workflow_run_conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "pull_requests=${{ toJSON(github.event.workflow_run.pull_requests) }}"
